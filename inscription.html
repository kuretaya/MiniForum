<!DOCTYPE html>
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniForum - Inscription</title>
</head>
<body>
    <header>
        <h1>MiniForum</h1>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="sujet.html">Sujets</a></li>
                <li><a href="connexion.html">Connexion</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Créer un compte</h2>

        <form action="/inscription" method="post">

            <fieldset>
                <legend>Identifiants</legend>

                <label for="pseudo">Pseudo</label>
                <input type="text" id="pseudo" name="pseudo" pattern="[A-Za-z0-9]{3,15}" title="3 à 15 lettres ou chiffres, sans espace ni accent" required>

                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" required>

                <label for="motdepasse">Mot de passe</label>
                <input type="password" id="motdepasse" name="motdepasse" minlength="8" required>

                <label for="naissance">Date de naissance</label>
                <input type="date" id="naissance" name="naissance">
            </fieldset>

            <fieldset>
                <legend>Préférences</legend>

                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Recevoir la lettre d'information</label>

                <input type="checkbox" id="cgu" name="cgu" required>
                <label for="cgu">J'accepte les conditions d'utilisation</label>
            </fieldset>

            <button type="submit">Créer mon compte</button>
            <a href="connexion.html">Déjà inscrit ? Se connecter</a>
        </form>
    </main>

    <footer>
        <p>MiniForum - Projet du cours de développement web</p>
        <p>Classe passerelle - cfpt-i</p>
    </footer>
</body>
</html>
